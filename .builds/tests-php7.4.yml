image: debian/bookworm
repositories:
  sury: https://packages.sury.org/php/ bookworm main 0x15058500a0235d97f5d10063b188e2b695bd4743
packages:
  - php7.4-cli
  - php7.4-dom
  - php7.4-mbstring
  - php7.4-mysql
  # Dependencies for composer
  - wget
  - php7.4-zip
  - unzip
  # Dependencies for tests
  - mariadb-server
environment:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: tests
  MYSQL_PASSWORD: create-random-password-here
  MYSQL_DATABASE: tests
sources:
  - https://git.sr.ht/~techwilk/database
tasks:
  - start-mysql: |
      sudo service mariadb start
      sudo mysql -e "
        CREATE DATABASE tests;
=        CREATE USER 'tests'@'127.0.0.1' IDENTIFIED BY 'create-random-password-here';
        GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,ALTER ON tests.* TO 'tests'@'127.0.0.1';
        FLUSH PRIVILEGES;
      "
  - install-composer: |
      wget -O composer-setup.php https://getcomposer.org/installer
      sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - setup: |
      cd database
      composer install
  - test: |
      cd database
      composer test
