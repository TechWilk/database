image: archlinux
packages:
  - php
  - composer
  - mariadb
environment:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: tests
  MYSQL_PASSWORD: create-random-password-here
  MYSQL_DATABASE: tests
sources:
  - https://git.sr.ht/~techwilk/database
tasks:
  - enable-php-ext: |
      sudo sed -i 's/^;extension=mysqli/extension=mysqli/' /etc/php/php.ini
      sudo sed -i 's/^;extension=pdo_mysql/extension=pdo_mysql/' /etc/php/php.ini
  - start-mysql: |
      sudo mariadb-install-db --user=mysql --basedir=/usr --datadir=/var/lib/mysql
      sudo systemctl start mariadb
      sudo mysql -e "
        CREATE DATABASE tests;
        CREATE USER 'tests'@'127.0.0.1' IDENTIFIED BY 'create-random-password-here';
        GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,ALTER ON tests.* TO 'tests'@'127.0.0.1';
        FLUSH PRIVILEGES;
      "
  - setup: |
      cd database
      composer install
  - test: |
      cd database
      composer test
